version: "2"
sql:
  - engine: "postgresql"
    queries: "./internmal/adapters/postgresql/sqlc/queries.sql"
    schema: "./internmal/adapters/postgresql/migrations"
    gen:
      go:
        package: "repo"
        out: "./internmal/adapters/postgresql/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
